goal: "CON-75: compare local custom MiMo-V2.5-Pro 6-bit MLX artifact against kernelpool/MiMo-V2.5-Pro-6bit without downloading the full kernelpool model, and recommend whether it is worth a bounded pilot download/probe."

constraints:
  - "Use a single Ouroboros+Goose sidecar execution for this comparison; do not split into many runs."
  - "Use git worktrees for isolation. The launcher will use --worktree-mode always; confirm the worktree path and branch in the final report."
  - "Do not start, stop, or modify any live exo/Kimi/MiMo runtime. This is metadata/static-analysis work only."
  - "Do not download the full kernelpool/MiMo-V2.5-Pro-6bit repository. It is about 778 GiB and /Volumes/GLM5-NVMe has only about 363 GiB free at launch."
  - "Hard cap downloaded comparison data to 2 GiB total, but aim for under 1 GiB. Prefer config.json, README.md, index/metadata files, Hugging Face tree metadata, and byte-range safetensors header samples."
  - "It is acceptable to inspect local full custom 6-bit metadata at /Volumes/GLM5-NVMe/exo/mimo-v25-pro/quantized/XiaomiMiMo--MiMo-V2.5-Pro-6bit-MLX, but do not copy that artifact."
  - "Treat local custom 6-bit as the quality-preferred candidate unless evidence suggests kernelpool has materially better runtime layout with acceptable quality risk."
  - "Compare artifact layout and loader compatibility, not benchmark quality. No generation quality claims without actual eval data."
  - "If remote safetensors header sampling is blocked by Hub/CDN range behavior, document the blocker and fall back to Hugging Face index/tree/config metadata."
  - "Preserve Track B sidecar work; do not edit its worktree. This comparison should create its own worktree and own report."
  - "Every produced script must have focused tests and must default to metadata-only/no-full-download behavior."
  - "Use CON-75-prefixed commit subjects for coherent output commits in the sidecar worktree."

acceptance_criteria:
  - "AC1 Preflight and disk-safety: record local free space, local custom 6-bit path/sha or file inventory, remote kernelpool repo revision, top-level file inventory, and explicit proof that full kernelpool download is not feasible/safe now."
  - "AC2 Metadata collector: implement a script that compares local custom 6-bit metadata with kernelpool/MiMo-V2.5-Pro-6bit using Hugging Face API tree metadata, config.json, README.md, and model index/config files without full download."
  - "AC3 Safetensors spot checks: implement bounded header-only sampling for selected local and remote shards to compare tensor key naming, dtype metadata, q/k/v vs qkv layout, scale/bias key conventions, layer coverage, and shard locality without reading tensor payloads."
  - "AC4 Quantization comparison: compare quantization configs and practical implications: bits, group_size, affine mode, 8-bit overrides, explicit q/k/v projections, key count, shard count, typical shard size, per-layer file fanout, and expected exo/MLX sanitize overhead."
  - "AC5 Runtime-risk assessment: produce a reasoned recommendation on whether kernelpool 6-bit is likely to reduce Track A memory/file-cache pressure relative to local custom 6-bit, and whether it is worth a partial pilot download of selected shards or a full download later after disk cleanup."
  - "AC6 Artifacts and tests: add focused unit tests for the metadata collector/header sampler and run py_compile, pytest, and ruff on changed files."
  - "AC7 Handoff: write a concise report under docs/ with findings, exact commands, download budget used, next safe experiments, and a clear answer to whether full download is required versus spot-checking."

