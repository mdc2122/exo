  name: "MiMoTrackBOmnimodalRollout"
  description: "Schema for a single Ouroboros worktree implementation run that makes regular MiMo V2.5 full text/image/video/audio support usable and testable in exo."
  fields:
    - name: "repo_path"
      field_type: "string"
      description: "Source repository path, expected /Users/studio2/exo."
    - name: "worktree_path"
      field_type: "string"
      description: "Ouroboros-created git worktree used for implementation."
    - name: "model_id"
      field_type: "string"
      description: "Hugging Face model id XiaomiMiMo/MiMo-V2.5."
    - name: "local_model_path"
      field_type: "string"
      description: "Local Studio2 model artifact path."
    - name: "capabilities"
      field_type: "list[string]"
      description: "Supported capabilities to expose and verify: text, image, video, audio, agentic, long-context."
    - name: "acceptance_progress"
      field_type: "string"
      description: "Compact progress counters in AC x/n and Sub-AC y/m form."
    - name: "test_evidence"
      field_type: "list[string]"
      description: "Commands and results for focused tests, lint, compile, and optional smoke gates."
    - name: "cluster_evidence"
      field_type: "list[string]"
      description: "Offline launch, preview, placement, or smoke evidence paths if a live guarded smoke is safe."
    - name: "handoff_doc"
      field_type: "string"
      description: "Path to the final rollout/handoff document under docs/."

