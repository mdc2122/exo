      description: "Operations explicitly forbidden from the probe and workflow."
    - name: "verification"
      field_type: "string"
      description: "Focused command/test evidence."
    - name: "observed_failure"
      field_type: "string"
      description: "Standalone Studio1 probe evidence the wrapper is designed to bisect."

